[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweaver"
version = "0.1.0"
description = "GPU-accelerated CRISPR alignment (off-target search) engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
dev = ["pytest>=7.0"]

[project.scripts]
geneweaver = "geneweaver.cli:main"

[tool.setuptools.packages.find]
include = ["geneweaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
